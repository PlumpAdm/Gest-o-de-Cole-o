<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef}=React;

// ── Helpers ──────────────────────────────────────────────────────────
const LS_KEY='gc_models_v3';
function pNum(v){if(typeof v==='number')return v;return parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;}
function pDate(s){if(!s)return null;const p=String(s).split('/');if(p.length===3)return new Date(+p[2],+p[1]-1,+p[0]);return new Date(s);}
function pDesc(d){const s=String(d||'');return{cor:s.match(/Cor:([^;,]+)/)?.[1]?.trim().toUpperCase()||null,tamanho:s.match(/Tamanho:([^;,\s]+)/)?.[1]?.trim().toUpperCase()||null};}
function fBRL(v){return'R$'+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}

function saveLS(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}
function loadLS(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch(e){return def;}}

async function readXLS(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}));}catch(e){rej(e);}};
    r.onerror=rej;r.readAsArrayBuffer(file);
  });
}

// ── Upseller Format Support ─────────────────────────────────────────
function detectFormat(rows){
  if(!rows||!rows.length)return'unknown';
  const keys=Object.keys(rows[0]);
  if(keys.some(k=>k==='Variantes')||keys.some(k=>k==='Unidades Vendidas'))return'upseller';
  if(keys.some(k=>k==='Descrição')||keys.some(k=>k==='Quantidade'))return'mercadolivre';
  return'unknown';
}
function parseVariantes(variantes, modelCores=[], modelTamanhos=[]){
  const sizeRe=/^(PP|P|M|GG|XGG?|G[0-9]+|[0-9]{2,3})$/i;
  const rawStr=String(variantes||'').trim();
  if(!rawStr||rawStr==='nan'||rawStr==='undefined'||rawStr==='null')
    return{cor:null,tamanho:null,completo:false};
  const parts=rawStr.split(',').map(s=>s.trim()).filter(Boolean);
  let cor=null,tamanho=null;
  // Pass 1: regex de tamanho
  for(const part of parts){
    if(sizeRe.test(part)){if(!tamanho)tamanho=part.toUpperCase();}
    // Normaliza hífen para espaço: "Marrom-escuro" → "MARROM ESCURO"
    else{if(!cor)cor=part.replace(/-/g,' ').toUpperCase().trim();}
  }
  // Pass 2: listas do modelo como fallback
  if(!tamanho||!cor){
    for(const part of parts){
      const up=part.replace(/-/g,' ').toUpperCase().trim();
      if(!tamanho&&modelTamanhos.some(t=>t.toUpperCase()===up))tamanho=up;
      if(!cor&&modelCores.some(c=>c.toUpperCase()===up))cor=up;
    }
  }
  const completo=!!(cor&&tamanho);
  return{cor,tamanho,completo};
}
function extractPeriodFromFilename(filename){
  if(!filename)return null;
  const m=filename.match(/(\d{8})-(\d{8})/);
  if(!m)return null;
  const p=s=>new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));
  return{minDate:p(m[1]),maxDate:p(m[2])};
}
function normalizeSku(v){return String(v||'').replace(/^0+/,'');}
function importEstoqueFromRows(rows,model){
  if(!rows||!rows.length)return null;
  const modelCores=model.cores||[];
  const modelTamanhos=model.tamanhos||[];
  const skuCode=normalizeSku(model.skuCode||'');
  const kw=(model.keyword||model.name||'').toUpperCase();
  // Detecta coluna de estoque (vários nomes possíveis no Upseller)
  const firstKeys=Object.keys(rows[0]||{});
  const stockCol=firstKeys.find(k=>/^(estoque|quantidade|qtde?|saldo|disponível|estoque\s*disponível|estoque\s*atual|qtd\.?\s*total)$/i.test(k.trim()))||null;
  if(!stockCol)return null;
  // Filtra linhas do modelo
  const filtered=rows.filter(r=>{
    const skuP=normalizeSku(r['SKU Principal']||'');
    const sku=normalizeSku(r['SKU']||'');
    // Suporta "Título" (Lista de Estoque) além de "Produtos"/"Produto" (Vendas por Variante)
    const titulo=String(r['Título']||'');
    // Para SKU, extrai parte antes do espaço no Título se necessário
    const produto=String(r['Produtos']||r['Produto']||titulo).toUpperCase();
    if(skuCode)return skuP===skuCode||sku===skuCode||sku.startsWith(skuCode)||skuP.startsWith(skuCode);
    return kw&&produto.includes(kw);
  });
  if(!filtered.length)return null;
  const result={};
  for(const row of filtered){
    const qty=pNum(row[stockCol]);
    if(qty<=0)continue;
    // Extrai variante da coluna Variantes/Variante OU do campo Título: "PRODUTO ( COR, TAMANHO )"
    let varStr=String(row['Variantes']||row['Variante']||'');
    if(!varStr){
      const tit=String(row['Título']||'');
      const mt=tit.match(/\(([^)]+)\)/);
      if(mt)varStr=mt[1].trim(); // ex: "BEGE, GG" — parseVariantes já trata vírgula como separador
    }
    const{cor,tamanho}=parseVariantes(varStr,modelCores,modelTamanhos);
    if(cor&&tamanho){const k=`${cor}||${tamanho}`;result[k]=(result[k]||0)+qty;}
  }
  return Object.keys(result).length?result:null;
}
// Largest Remainder Method — garante soma exata sem perda de arredondamento
function distribuirProporcional(qty,rec,dist){
  const tot=Object.values(dist).reduce((s,v)=>s+v,0);
  if(!tot)return[];
  const items=Object.entries(dist).map(([key,v])=>({
    key,floor:Math.floor(qty*v/tot),remainder:(qty*v/tot)%1,recExact:rec*v/tot
  }));
  const allocated=items.reduce((s,i)=>s+i.floor,0);
  let remaining=qty-allocated;
  items.sort((a,b)=>b.remainder-a.remainder);
  for(let i=0;i<remaining;i++)items[i].floor+=1;
  return items.filter(i=>i.floor>0).map(i=>({key:i.key,qty:i.floor,rec:Math.round(i.recExact*100)/100}));
}

function runAnalysisUpseller(rows,model,filename){
  const kw=(model.keyword||model.name||'').toUpperCase();
  const skuCode=normalizeSku(model.skuCode||'');
  const modelCores=model.cores||[];
  const modelTamanhos=model.tamanhos||[];

  const filtered=rows.filter(r=>{
    const produto=String(r['Produtos']||'').toUpperCase();
    const skuPrincipal=normalizeSku(r['SKU Principal']||'');
    const sku=normalizeSku(r['SKU']||'');
    if(skuCode)return skuPrincipal===skuCode||sku===skuCode||sku.startsWith(skuCode)||skuPrincipal.startsWith(skuCode);
    return kw&&produto.includes(kw);
  });
  if(!filtered.length)return null;

  // Período do nome do arquivo
  let days=30,minDate=new Date(Date.now()-30*86400000),maxDate=new Date();
  const period=extractPeriodFromFilename(filename);
  if(period){minDate=period.minDate;maxDate=period.maxDate;days=Math.max(1,Math.round((maxDate-minDate)/86400000)+1);}

  // 1ª passagem: separar completos dos incompletos
  const completeRows=[],incompleteRows=[];
  let skippedUnits=0;
  for(const row of filtered){
    const qty=pNum(row['Unidades Vendidas']);
    const rec=pNum(row['Pagamentos Recebidos']||row['Valor de Vendas']);
    const{cor,tamanho,completo}=parseVariantes(row['Variantes'],modelCores,modelTamanhos);
    if(!cor&&!tamanho){skippedUnits+=qty;continue;}
    if(completo)completeRows.push({cor,tamanho,qty,rec});
    else incompleteRows.push({cor,tamanho,qty,rec});
  }

  // Mapas de distribuição proporcional
  const colorSizeDist={},sizeColorDist={};
  for(const r of completeRows){
    if(!colorSizeDist[r.cor])colorSizeDist[r.cor]={};
    colorSizeDist[r.cor][r.tamanho]=(colorSizeDist[r.cor][r.tamanho]||0)+r.qty;
    if(!sizeColorDist[r.tamanho])sizeColorDist[r.tamanho]={};
    sizeColorDist[r.tamanho][r.cor]=(sizeColorDist[r.tamanho][r.cor]||0)+r.qty;
  }

  // Agregar incompletas por grupo ANTES de distribuir (elimina perda por floating-point entre chamadas)
  const groupCor={},groupTam={};
  for(const r of incompleteRows){
    if(r.qty<=0)continue;
    if(r.cor&&!r.tamanho){
      if(!groupCor[r.cor])groupCor[r.cor]={qty:0,rec:0};
      groupCor[r.cor].qty+=r.qty;groupCor[r.cor].rec+=r.rec;
    }else if(r.tamanho&&!r.cor){
      if(!groupTam[r.tamanho])groupTam[r.tamanho]={qty:0,rec:0};
      groupTam[r.tamanho].qty+=r.qty;groupTam[r.tamanho].rec+=r.rec;
    }
  }
  const allRows=[...completeRows];
  let redistributedUnits=0;
  // Uma única chamada por grupo — garante soma exata
  for(const[cor,agg]of Object.entries(groupCor)){
    const dist=colorSizeDist[cor];
    if(dist&&agg.qty>0){
      for(const item of distribuirProporcional(agg.qty,agg.rec,dist)){
        allRows.push({cor,tamanho:item.key,qty:item.qty,rec:item.rec});
        redistributedUnits+=item.qty;
      }
    }else if(agg.qty>0){allRows.push({cor,tamanho:'SEM_TAM',qty:agg.qty,rec:agg.rec});redistributedUnits+=agg.qty;}
  }
  for(const[tam,agg]of Object.entries(groupTam)){
    const dist=sizeColorDist[tam];
    if(dist&&agg.qty>0){
      for(const item of distribuirProporcional(agg.qty,agg.rec,dist)){
        allRows.push({cor:item.key,tamanho:tam,qty:item.qty,rec:item.rec});
        redistributedUnits+=item.qty;
      }
    }else if(agg.qty>0){allRows.push({cor:'SEM_COR',tamanho:tam,qty:agg.qty,rec:agg.rec});redistributedUnits+=agg.qty;}
  }
  if(!allRows.length)return null;

  // Agregação final
  const sMap={},rMap={},cMap={},tMap={};
  let totalU=0,totalR=0;
  for(const r of allRows){
    if(!r.cor||!r.tamanho||r.qty<=0)continue;
    const k=`${r.cor}||${r.tamanho}`;
    sMap[k]=(sMap[k]||0)+r.qty;rMap[k]=(rMap[k]||0)+r.rec;
    cMap[r.cor]=(cMap[r.cor]||0)+r.qty;tMap[r.tamanho]=(tMap[r.tamanho]||0)+r.qty;
    totalU+=r.qty;totalR+=r.rec;
  }
  if(!totalU)return null;

  const cores=Object.entries(cMap).sort((a,b)=>b[1]-a[1]);
  const tamanhos=Object.entries(tMap).sort((a,b)=>b[1]-a[1]);
  const midTs=minDate.getTime()+(maxDate.getTime()-minDate.getTime())/2;
  const p1Days=Math.ceil(days/2)||1,p2Days=Math.floor(days/2)||1;

  const skuTable=Object.entries(sMap).map(([k,qty])=>{
    const[cor,tamanho]=k.split('||');
    const rec=rMap[k]||0,ticketUnit=qty>0?rec/qty:0,velDay=qty/days;
    const p1Qty=Math.ceil(qty/2),p2Qty=Math.floor(qty/2);
    return{cor,tamanho,qty,pct:totalU>0?qty/totalU*100:0,velDay,activeDays:days,isNew:false,
      rec,luc:0,fre:0,ticketUnit,lucUnit:0,freUnit:0,margemML:0,
      p1Qty,p2Qty,vel1:p1Qty/p1Days,vel2:p2Qty/p2Days,velVar:0};
  }).sort((a,b)=>b.qty-a.qty);

  const p1Map=Object.fromEntries(Object.entries(sMap).map(([k,v])=>[k,Math.ceil(v/2)]));
  const p2Map=Object.fromEntries(Object.entries(sMap).map(([k,v])=>[k,Math.floor(v/2)]));
  const vel1Total=(totalU/2)/p1Days,vel2Total=(totalU/2)/p2Days;

  return{fmt:'upseller',days,minDate:minDate.toISOString(),maxDate:maxDate.toISOString(),
    midDate:new Date(midTs).toISOString(),p1Days,p2Days,
    totalU,totalR,totalL:0,totalF:0,
    avgTicket:totalU>0?totalR/totalU:0,dailyAvg:totalU/days,
    p1TotalU:Math.ceil(totalU/2),p2TotalU:Math.floor(totalU/2),
    vel1Total,vel2Total,velVarTotal:0,
    sMap,rMap,lMap:{},fMap:{},p1Map,p2Map,cores,tamanhos,skuTable,
    redistributedUnits,skippedUnits};
}

function runAnalysisMercadoLivre(rows,model){
  const kw=(model.keyword||model.name||'').toUpperCase();
  const skuCode=(model.skuCode||'').trim();
  const filtered=rows.filter(r=>{
    const desc=String(r['Descrição']||'').toUpperCase();
    const sku=String(r['Código do produto pai']||'').trim();
    const sit=String(r['Situação']||'').toLowerCase();
    if(sit&&sit!=='atendido')return false;
    if(skuCode&&sku===skuCode)return true;
    if(!skuCode&&kw&&desc.includes(kw))return true;
    return false;
  });
  if(!filtered.length)return null;

  const allDates=filtered.map(r=>pDate(r['Data'])).filter(Boolean).map(d=>d.getTime());
  const globalMin=Math.min(...allDates),globalMax=Math.max(...allDates);
  const minDate=new Date(globalMin),maxDate=new Date(globalMax);
  const days=Math.max(1,Math.round((globalMax-globalMin)/86400000)+1);
  const midTs=globalMin+(globalMax-globalMin)/2;

  // Per-SKU accumulators
  const sMap={},rMap={},lMap={},fMap={},cMap={},tMap={};
  const p1Map={},p2Map={};
  // Per-SKU date tracking for active-days calculation
  const skuMinDate={},skuMaxDate={};
  let totalU=0,totalR=0,totalL=0,totalF=0;
  const p1Dates=[],p2Dates=[];

  for(const row of filtered){
    const{cor,tamanho}=pDesc(row['Descrição']);
    const qty=pNum(row['Quantidade']);
    if(!cor||!tamanho||qty<=0)continue;
    const k=`${cor}||${tamanho}`;
    const rec=pNum(row['Valor total']);
    const luc=pNum(row['Lucro']);
    const fre=pNum(row['Custo de Frete']||row['Frete']||0);
    const rowDate=pDate(row['Data']);
    const rowTs=rowDate?rowDate.getTime():globalMax;

    sMap[k]=(sMap[k]||0)+qty;
    rMap[k]=(rMap[k]||0)+rec;
    lMap[k]=(lMap[k]||0)+luc;
    fMap[k]=(fMap[k]||0)+fre;
    cMap[cor]=(cMap[cor]||0)+qty;
    tMap[tamanho]=(tMap[tamanho]||0)+qty;
    totalU+=qty;totalR+=rec;totalL+=luc;totalF+=fre;

    // Track per-SKU first/last sale date
    if(!skuMinDate[k]||rowTs<skuMinDate[k])skuMinDate[k]=rowTs;
    if(!skuMaxDate[k]||rowTs>skuMaxDate[k])skuMaxDate[k]=rowTs;

    if(rowTs<=midTs){p1Map[k]=(p1Map[k]||0)+qty;p1Dates.push(rowTs);}
    else{p2Map[k]=(p2Map[k]||0)+qty;p2Dates.push(rowTs);}
  }

  let p1Days=0,p2Days=0;
  if(p1Dates.length){const mn=Math.min(...p1Dates),mx=Math.max(...p1Dates);p1Days=Math.max(1,Math.round((mx-mn)/86400000)+1);}
  else p1Days=Math.ceil(days/2);
  if(p2Dates.length){const mn=Math.min(...p2Dates),mx=Math.max(...p2Dates);p2Days=Math.max(1,Math.round((mx-mn)/86400000)+1);}
  else p2Days=Math.ceil(days/2);

  // NEW_THRESHOLD: SKU is "new" if first sale is in the last 21 days of the period
  const newThresholdTs=globalMax-(21*86400000);

  const cores=Object.entries(cMap).sort((a,b)=>b[1]-a[1]);
  const tamanhos=Object.entries(tMap).sort((a,b)=>b[1]-a[1]);

  const skuTable=Object.entries(sMap).map(([k,qty])=>{
    const[cor,tamanho]=k.split('||');
    const rec=rMap[k]||0,luc=lMap[k]||0,fre=fMap[k]||0;
    const ticketUnit=qty>0?rec/qty:0;
    const lucUnit=qty>0?luc/qty:0;
    const freUnit=qty>0?fre/qty:0;
    const margemML=rec>0?luc/rec*100:0;

    // Active days: from SKU's first sale to end of period
    const skuFirst=skuMinDate[k]||globalMin;
    const activeDays=Math.max(1,Math.round((globalMax-skuFirst)/86400000)+1);
    const isNew=skuFirst>newThresholdTs;

    // Velocity: use activeDays (accurate for new SKUs, same as days for established ones)
    const velDay=qty/activeDays;

    const vel1=(p1Map[k]||0)/p1Days;
    const vel2=(p2Map[k]||0)/p2Days;
    const velVar=vel1>0?(vel2-vel1)/vel1*100:vel2>0?100:0;

    return{cor,tamanho,qty,pct:totalU>0?qty/totalU*100:0,
      velDay,activeDays,isNew,
      rec,luc,fre,ticketUnit,lucUnit,freUnit,margemML,
      p1Qty:p1Map[k]||0,p2Qty:p2Map[k]||0,vel1,vel2,velVar};
  }).sort((a,b)=>b.qty-a.qty);

  const p1TotalU=Object.values(p1Map).reduce((s,v)=>s+v,0);
  const p2TotalU=Object.values(p2Map).reduce((s,v)=>s+v,0);
  const vel1Total=p1TotalU/p1Days,vel2Total=p2TotalU/p2Days;
  const velVarTotal=vel1Total>0?(vel2Total-vel1Total)/vel1Total*100:vel2Total>0?100:0;

  return{days,minDate:minDate.toISOString(),maxDate:maxDate.toISOString(),
    midDate:new Date(midTs).toISOString(),p1Days,p2Days,
    totalU,totalR,totalL,totalF,
    avgTicket:totalU>0?totalR/totalU:0,dailyAvg:totalU/days,
    p1TotalU,p2TotalU,vel1Total,vel2Total,velVarTotal,
    sMap,rMap,lMap,fMap,p1Map,p2Map,cores,tamanhos,skuTable};
}

function buildRep(analysis,stock,model){
  if(!analysis)return[];
  const{skuTable,days}=analysis;
  const ld=model.leadTimeDays||15,sd=model.safetyDays||7;

  // Build a velocity map from skuTable (uses activeDays-corrected velocity)
  const velMap={};
  (skuTable||[]).forEach(s=>{velMap[`${s.cor}||${s.tamanho}`]=s;});

  return(model.cores||[]).flatMap(cor=>(model.tamanhos||[]).map(tam=>{
    const k=`${cor}||${tam}`;
    const skuData=velMap[k];
    const vel=skuData?skuData.velDay:0;
    const isNew=skuData?skuData.isNew:false;
    const activeDays=skuData?skuData.activeDays:days;
    const curr=+(stock[k]||0);

    // Coverage: use model setting; new SKUs get half (conservative)
    const baseCov=model.coverageDays||30;
    const covDays=isNew?Math.max(15,Math.ceil(baseCov/2)):baseCov;
    const dLeft=vel>0?curr/vel:Infinity;
    const rop=vel*(ld+sd);
    const sug=vel>0?Math.max(1,Math.ceil(vel*covDays)):0;

    let status='ok';
    if(vel===0&&curr===0)status='sem_giro';
    else if(curr<=0&&vel>0)status='zerado';
    else if(vel>0&&dLeft<=ld)status='urgente';
    else if(vel>0&&curr<=rop)status='atencao';

    return{cor,tam,k,
      sold:skuData?skuData.qty:0,
      vel,isNew,activeDays,covDays,curr,
      dLeft:isFinite(dLeft)?Math.round(dLeft):null,
      rop:Math.round(rop),sug,status};
  })).sort((a,b)=>({zerado:0,urgente:1,atencao:2,ok:3,sem_giro:4}[a.status]||5)-({zerado:0,urgente:1,atencao:2,ok:3,sem_giro:4}[b.status]||5));
}


function runAnalysis(rows,model,filename){
  const fmt=detectFormat(rows);
  if(fmt==='upseller')return runAnalysisUpseller(rows,model,filename);
  return runAnalysisMercadoLivre(rows,model);
}

function genInsights(an,model){
  if(!an)return[];
  const{cores,tamanhos,skuTable,totalU,dailyAvg,days}=an;
  const ld=model.leadTimeDays||15,sd=model.safetyDays||7;
  const ins=[];
  if(cores.length){const[tc,tq]=cores[0];ins.push({tipo:'top',txt:`${tc} é a cor campeã com ${(tq/totalU*100).toFixed(0)}% das vendas (${tq} un). Nunca deixe essa variação zerar — é o motor do faturamento deste modelo.`});}
  if(tamanhos.length>=2){const top2=tamanhos.slice(0,2);const p=(top2.reduce((s,[,q])=>s+q,0)/totalU*100).toFixed(0);ins.push({tipo:'tam',txt:`${top2.map(([t])=>t).join(' e ')} somam ${p}% das vendas. Esses tamanhos esgotam primeiro — mantenha estoque mais fundo nessas grades.`});}
  if(skuTable.length){const t=skuTable[0];const rop=Math.ceil(t.velDay*(ld+sd));ins.push({tipo:'rep',txt:`SKU âncora: ${t.cor} ${t.tamanho} vende ${t.velDay.toFixed(2)} un/dia. Com ${ld}d de lead time + ${sd}d de segurança, o ponto de pedido é ${rop} unidades — abaixo disso, peça imediatamente.`});}
  const zeros=skuTable.filter(s=>s.qty===0);
  if(zeros.length)ins.push({tipo:'alerta',txt:`${zeros.length} variação(ões) sem nenhuma venda: ${zeros.map(s=>`${s.cor} ${s.tamanho}`).join(', ')}. Considere não repor essas combinações no próximo lote.`});
  if(cores.length>1){const[bc,bq]=cores[cores.length-1];ins.push({tipo:'corte',txt:`${bc} representa apenas ${(bq/totalU*100).toFixed(0)}% (${bq} un). Avalie concentrar mais no próximo lote nas cores líderes.`});}
  ins.push({tipo:'proj',txt:`Velocidade atual: ${dailyAvg.toFixed(2)} un/dia (${days} dias analisados). Projeção 30 dias: ~${Math.round(dailyAvg*30)} unidades. Use como base mínima do próximo lote.`});
  return ins;
}

  const[showForm,setShowForm]=useState(false);
  const[formData,setFormData]=useState({dataPedido:'',dataEntrega:'',obs:'',itens:[]});
  const[selModelId,setSelModelId]=useState('');

  const selModel=models.find(m=>m.id===selModelId);
  const selAn=selModelId?analyses[selModelId]:null;
  const selSt=selModelId?(stocks[selModelId]||{}):{};
  const selCusto=selModelId?(costs[selModelId]||0):0;
  const selRep=selModel&&selAn?buildRep(selAn,selSt,selModel):[];

  // Items to include in lote for selected model
  const hasStock=Object.keys(selSt).length>0;
  const estrategia=selModel?.estrategiaLote||'inteligente';
  
  // Nova lógica com 3 estratégias
  const loteItens=selModel&&selAn?(
    estrategia==='full'
      // FULL GRADE: todas as combinações cor×tamanho
      ?(selModel.cores||[]).flatMap(cor=>(selModel.tamanhos||[]).map(tam=>{
          const k=`${cor}||${tam}`;
          const repItem=selRep.find(r=>r.k===k);
          const vel=repItem?repItem.vel:0;
          const isCritico=repItem&&(repItem.status==='zerado'||repItem.status==='urgente'||repItem.status==='atencao');
          const ld=selModel.leadTimeDays||15;
          const sd=selModel.safetyDays||7;
          
          // Se crítico: cobertura. Senão: mínimo (mesmo sem venda = 1 peça)
          const tipoCalculo=isCritico?'cobertura':'minimo';
          const sugFinal=isCritico?(repItem?repItem.sug:1):Math.max(1,Math.ceil(vel*(ld+sd))||1);
          
          return{
            cor,tam,k,
            vel,
            isNew:repItem?repItem.isNew:false,
            activeDays:repItem?repItem.activeDays:0,
            curr:repItem?repItem.curr:0,
            status:repItem?repItem.status:'sem_giro',
            tipoCalculo,
            sugFinal,
            sugOriginal:repItem?repItem.sug:1,
            diasCalculo:isCritico?(repItem?repItem.covDays:30):(ld+sd),
            sold:repItem?repItem.sold:0,
            dLeft:repItem?repItem.dLeft:null,
            rop:repItem?repItem.rop:0,
            sug:repItem?repItem.sug:1,
            covDays:repItem?repItem.covDays:(ld+sd)
          };
        }))
      :estrategia==='critico'
      // APENAS CRÍTICAS: só zerado/urgente/atenção
      ?selRep.filter(r=>r.status==='zerado'||r.status==='urgente'||r.status==='atencao').map(r=>({
          ...r,
          tipoCalculo:'cobertura',
          sugFinal:r.sug,
          sugOriginal:r.sug,
          diasCalculo:r.covDays
        }))
      // INTELIGENTE: crítico + mínimo (apenas com venda)
      :selRep.filter(r=>r.vel>0).map(r=>{
          const isCritico=r.status==='zerado'||r.status==='urgente'||r.status==='atencao';
          const ld=selModel.leadTimeDays||15;
          const sd=selModel.safetyDays||7;
          
          const tipoCalculo=isCritico?'cobertura':'minimo';
          const sugFinal=isCritico?r.sug:Math.max(1,Math.ceil(r.vel*(ld+sd)));
          
          return{
            ...r,
            tipoCalculo,
            sugFinal,
            sugOriginal:r.sug,
            diasCalculo:isCritico?r.covDays:(ld+sd)
          };
        })

  const totalPecas=loteItens.reduce((s,r)=>s+r.sugFinal,0);

// ── LucratividadeView ──────────────────────────────────────────────────
function LucratividadeView({models,analyses,costs,selId,onSel}){
  const model=models.find(m=>m.id===selId);
  const an=selId?analyses[selId]:null;
  const custo=selId?(costs[selId]||0):0;

  // Build lucratividade table
  let rows=[];
  if(an&&an.skuTable){
    rows=an.skuTable
      .filter(s=>s.qty>0)
      .map(s=>{
        // ticket, lucro marketplace, frete — todos por unidade
        const ticketUnit=s.ticketUnit||0;
        const lucMLUnit=s.lucUnit||0;   // Lucro já descontado taxas ML
        const freUnit=s.freUnit||0;
        // Lucro real = lucro ML - custo fabricação
        const lucRealUnit=lucMLUnit-custo;
        const margemReal=ticketUnit>0?lucRealUnit/ticketUnit*100:0;
        const margemML=s.margemML||0;
        // Classificação
        let tier='A';
        if(margemReal<0)tier='D';
        else if(margemReal<15)tier='C';
        else if(margemReal<30)tier='B';
        return{...s,ticketUnit,lucMLUnit,freUnit,lucRealUnit,margemReal,margemML,tier};
      })
      .sort((a,b)=>b.margemReal-a.margemReal);
  }

  const fmtDate=iso=>new Date(iso).toLocaleDateString('pt-BR');
  const semCusto=!custo&&model;
  const bestSku=rows[0];
  const worstSku=rows[rows.length-1];
  const avgMargem=rows.length?rows.reduce((s,r)=>s+r.margemReal,0)/rows.length:0;
  const maxMargem=rows.length?Math.max(...rows.map(r=>r.margemReal)):0;

  // Insights
  const insights=[];
  if(rows.length&&bestSku){
    insights.push({tipo:'top',txt:`Variação mais lucrativa: ${bestSku.cor} ${bestSku.tamanho} com ${bestSku.margemReal.toFixed(1)}% de margem real (${fBRL(bestSku.lucRealUnit)} por peça). Priorize o estoque desta variação.`});
  }
  if(rows.length&&worstSku&&worstSku.margemReal<15){
    insights.push({tipo:'alerta',txt:`${worstSku.cor} ${worstSku.tamanho} tem a menor margem: ${worstSku.margemReal.toFixed(1)}% (${fBRL(worstSku.lucRealUnit)}/peça). ${worstSku.margemReal<0?'Está vendendo no prejuízo — revise o preço ou reduza o custo.':'Avalie ajuste de preço antes da próxima reposição.'}`});
  }
  const tierD=rows.filter(r=>r.tier==='D');
  if(tierD.length)insights.push({tipo:'corte',txt:`${tierD.length} variação(ões) com margem negativa: ${tierD.map(r=>`${r.cor} ${r.tamanho}`).join(', ')}. Cada peça vendida gera prejuízo — ação imediata necessária.`});
  if(rows.length&&an){
    const topVol=an.skuTable[0];
    const topLuc=rows[0];
    if(topVol&&topLuc&&(topVol.cor!==topLuc.cor||topVol.tamanho!==topLuc.tamanho)){
      insights.push({tipo:'rep',txt:`Atenção: a variação que mais vende em volume (${topVol.cor} ${topVol.tamanho}) não é a mais lucrativa (${topLuc.cor} ${topLuc.tamanho}). Considere isso ao decidir o tamanho do próximo lote.`});
    }
  }
  insights.push({tipo:'proj',txt:`Margem real média do modelo: ${avgMargem.toFixed(1)}%. Isso considera ticket médio, taxas do marketplace e custo de fabricação informado. Atualize o custo sempre que houver reajuste da costureira.`});

  const TIER_INFO={A:{bg:'#EAF3DE',col:'#3B6D11',lbl:'A — Alta'},B:{bg:'#E6F1FB',col:'#185FA5',lbl:'B — Boa'},C:{bg:'#FAEEDA',col:'#854F0B',lbl:'C — Baixa'},D:{bg:'#FCEBEB',col:'#A32D2D',lbl:'D — Negativa'}};
  const INSIGHT_ST={top:{bg:'#EAF3DE',col:'#3B6D11',ic:'↑'},alerta:{bg:'#FCEBEB',col:'#A32D2D',ic:'⚠'},corte:{bg:'#FCEBEB',col:'#A32D2D',ic:'✕'},rep:{bg:'#E6F1FB',col:'#185FA5',ic:'↺'},proj:{bg:'#F1EFE8',col:'#5F5E5A',ic:'→'}};

  return React.createElement('div',null,
    React.createElement('div',{style:{fontSize:17,fontWeight:600,marginBottom:2}},'Lucratividade por variação'),
    React.createElement('div',{style:{fontSize:12,color:'var(--text2)',marginBottom:14}},'Margem real por SKU após taxas do marketplace e custo de fabricação.'),

    // Seletor de modelo
    React.createElement(SelModel,{models,value:selId,onChange:onSel}),

    !selId&&React.createElement('div',{className:'card no-data',style:{padding:32}},'Selecione um modelo para ver a lucratividade.'),
    selId&&!an&&React.createElement('div',{className:'card no-data',style:{padding:32}},'Sem análise carregada. Vá na aba Análise e faça upload do relatório.'),

    selId&&an&&React.createElement('div',null,
      // Aviso formato Upseller (sem lucro)
      an.fmt==='upseller'&&React.createElement('div',{style:{fontSize:12,color:'#534AB7',marginBottom:12,padding:'10px 13px',background:'#EEEDFE',border:'1px solid #B5B3DD',borderRadius:9,lineHeight:1.6}},
        '📦 Relatório Upseller não contém dados de lucro por variação. ',
        React.createElement('strong',null,'A análise de lucratividade não está disponível para este formato. '),
        'Para lucratividade completa, utilize o relatório de vendas do Mercado Livre (com colunas Lucro e Valor total).'
      ),
      // Aviso custo não informado
      !an.fmt!=='upseller'&&semCusto&&React.createElement('div',{style:{fontSize:12,color:'var(--amber)',marginBottom:12,padding:'10px 13px',background:'var(--amberbg)',border:'1px solid #FAC775',borderRadius:9,lineHeight:1.6}},
        '⚠ O custo de fabricação deste modelo não está informado. A margem real mostrada considera apenas as taxas do marketplace. ',
        React.createElement('strong',null,'Acesse a aba Lote para informar o custo por peça.')
      ),

      // Métricas gerais
      React.createElement('div',{className:'met-grid',style:{marginBottom:12}},
        React.createElement(Met,{label:'Custo fabricação/peça',value:custo>0?fBRL(custo):'Não informado',sub:'Configure na aba Lote'}),
        React.createElement(Met,{label:'Margem real média',value:`${avgMargem.toFixed(1)}%`,sub:'Após taxas + fabricação'}),
        React.createElement(Met,{label:'Melhor variação',value:bestSku?`${bestSku.margemReal.toFixed(1)}%`:'—',sub:bestSku?`${bestSku.cor} ${bestSku.tamanho}`:''}),
        React.createElement(Met,{label:'Pior variação',value:worstSku?`${worstSku.margemReal.toFixed(1)}%`:'—',sub:worstSku?`${worstSku.cor} ${worstSku.tamanho}`:''})
      ),

      // Insights
      React.createElement('div',{className:'card',style:{marginBottom:12}},
        React.createElement(SecTitle,null,'Raciocínio analítico'),
        insights.map((ins,i)=>{const st=INSIGHT_ST[ins.tipo]||INSIGHT_ST.proj;return React.createElement('div',{key:i,className:'insight',style:{background:st.bg}},
          React.createElement('span',{className:'insight-icon',style:{color:st.col}},st.ic),
          React.createElement('span',{className:'insight-text'},ins.txt)
        );})
      ),

      // Gráfico de barras de margem real
      React.createElement('div',{className:'card',style:{marginBottom:12}},
        React.createElement(SecTitle,null,'Margem real por variação (%)'),
        React.createElement('div',{style:{display:'flex',gap:12,flexWrap:'wrap',marginBottom:10}},
          Object.entries(TIER_INFO).map(([t,v])=>React.createElement('span',{key:t,className:`tier-badge tier-${t}`},v.lbl))
        ),
        rows.map((r,i)=>{

          return React.createElement('div',{key:i,className:'luc-bar-wrap'},
            React.createElement('div',{className:'luc-bar-label'},`${r.cor} · ${r.tamanho}`),
            React.createElement('div',{className:'bar-track'},
              r.margemReal>0

            ),
            React.createElement('div',{className:'luc-bar-val',style:{color:ti.col}},`${r.margemReal.toFixed(1)}%`)
          );
        })
      ),

      // Tabela detalhada
      React.createElement('div',{className:'card'},
        React.createElement(SecTitle,null,'Detalhamento por variação'),
        React.createElement('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:10,lineHeight:1.5}},
          React.createElement('strong',null,'Ticket médio: '),'preço médio recebido por peça. ',
          React.createElement('strong',null,'Lucro ML: '),'após taxas do marketplace, antes do custo de fabricação. ',
          React.createElement('strong',null,'Custo fab.: '),'valor informado na aba Lote. ',
          React.createElement('strong',null,'Lucro real: '),'Lucro ML − Custo fab. ',
          React.createElement('strong',null,'Margem real: '),'Lucro real ÷ Ticket médio.'
        ),
        React.createElement('div',{style:{overflowX:'auto'}},
          React.createElement('table',null,
            React.createElement('thead',null,React.createElement('tr',null,
              ...['Variação','Qtd','Ticket médio','Lucro ML/un','Custo fab./un','Lucro real/un','Margem real','Tier'].map(h=>React.createElement('th',{key:h},h))
            )),
            React.createElement('tbody',null,

                const ti=TIER_INFO[r.tier];

                  React.createElement('td',null,fBRL(r.ticketUnit)),
                  React.createElement('td',null,fBRL(r.lucMLUnit)),

          React.createElement('strong',{style:{color:'#3B6D11'}},'A ≥ 30%'),': prioridade máxima de reposição. ',
          React.createElement('strong',{style:{color:'#185FA5'}},'B 15–29%'),': boa margem, manter estoque estável. ',
          React.createElement('strong',{style:{color:'#854F0B'}},'C 0–14%'),': baixa margem, avaliar ajuste de preço ou custo. ',
          React.createElement('strong',{style:{color:'#A32D2D'}},'D < 0%'),': prejuízo por peça — ação imediata necessária.'
        )
      )
    )
  );
}

// ── CicloVidaView ──────────────────────────────────────────────────────
function CicloVidaView({models,analyses,selId,onSel}){
  const an=selId?analyses[selId]:null;
  const fmtDate=iso=>new Date(iso).toLocaleDateString('pt-BR');
  const fmtVar=v=>{
    const s=v>0?'+':'';
    return `${s}${v.toFixed(1)}%`;
  };

  // Determine phase from velVar
  function getPhase(velVar,vel1,vel2){
    if(vel1===0&&vel2===0)return{key:'sem_giro',lbl:'Sem giro',desc:'Nenhuma venda nos dois períodos.',color:'#5F5E5A',bg:'#F1EFE8',icon:'○'};
    if(vel1===0&&vel2>0)return{key:'lancamento',lbl:'Lançamento',desc:'Primeiras vendas detectadas no período recente.',color:'#534AB7',bg:'#EEEDFE',icon:'✦'};
    if(velVar>=20)return{key:'crescimento',lbl:'Crescimento',desc:'Aceleração significativa de vendas. Aumente o estoque e reforce o anúncio.',color:'#3B6D11',bg:'#EAF3DE',icon:'↑'};
    if(velVar>=-10&&velVar<20)return{key:'maturidade',lbl:'Maturidade',desc:'Vendas estáveis. Mantenha estoque adequado e monitore margem.',color:'#185FA5',bg:'#E6F1FB',icon:'→'};
    if(velVar>=-35&&velVar<-10)return{key:'desaceleracao',lbl:'Desaceleração',desc:'Queda moderada. Avalie promoção ou redução de lote.',color:'#854F0B',bg:'#FAEEDA',icon:'↘'};
    return{key:'declinio',lbl:'Declínio',desc:'Queda acentuada. Considere liquidar estoque e descontinuar.',color:'#A32D2D',bg:'#FCEBEB',icon:'↓'};
  }

  // Build SKU ciclo table
  let skuRows=[];
  if(an&&an.skuTable){
    skuRows=an.skuTable
      .filter(s=>s.qty>0)
      .map(s=>({...s,phase:getPhase(s.velVar,s.vel1,s.vel2)}))
      .sort((a,b)=>b.velVar-a.velVar);
  }

  const modelPhase=an?getPhase(an.velVarTotal,an.vel1Total,an.vel2Total):null;

  // Insights
  const insights=[];
  if(an&&modelPhase){
    insights.push({tipo:modelPhase.key==='crescimento'?'top':modelPhase.key==='declinio'?'alerta':'rep',
      txt:`Fase atual: ${modelPhase.lbl}. ${modelPhase.desc} Variação de velocidade: ${fmtVar(an.velVarTotal)} entre os dois períodos.`});
    const acelerando=skuRows.filter(r=>r.velVar>=20);
    const caindo=skuRows.filter(r=>r.velVar<-10);
    if(acelerando.length)insights.push({tipo:'top',txt:`Variações em crescimento: ${acelerando.map(r=>`${r.cor} ${r.tamanho} (${fmtVar(r.velVar)})`).join(', ')}. Priorize estoque nessas combinações.`});
    if(caindo.length)insights.push({tipo:'alerta',txt:`Variações em queda: ${caindo.map(r=>`${r.cor} ${r.tamanho} (${fmtVar(r.velVar)})`).join(', ')}. Reduza o lote de reposição ou avalie descontinuar.`});
    const stable=skuRows.filter(r=>r.velVar>=-10&&r.velVar<20&&r.vel1>0);
    if(stable.length)insights.push({tipo:'proj',txt:`${stable.length} variação(ões) estável(eis): ${stable.map(r=>`${r.cor} ${r.tamanho}`).join(', ')}. Mantenha reposição no ritmo atual.`});
    insights.push({tipo:'proj',txt:`Velocidade período 1: ${an.vel1Total.toFixed(2)} un/dia → Período 2: ${an.vel2Total.toFixed(2)} un/dia. Relatório com ${an.days} dias dividido ao meio em ${fmtDate(an.midDate)}.`});
  }

  const INS_ST={top:{bg:'#EAF3DE',col:'#3B6D11',ic:'↑'},lancamento:{bg:'#EEEDFE',col:'#534AB7',ic:'✦'},alerta:{bg:'#FCEBEB',col:'#A32D2D',ic:'⚠'},rep:{bg:'#E6F1FB',col:'#185FA5',ic:'↺'},proj:{bg:'#F1EFE8',col:'#5F5E5A',ic:'→'}};
  const maxAbsVar=skuRows.length?Math.max(1,...skuRows.map(r=>Math.abs(r.velVar))):1;

  return React.createElement('div',null,
    React.createElement('div',{style:{fontSize:17,fontWeight:600,marginBottom:2}},'Ciclo de vida do modelo'),
    React.createElement('div',{style:{fontSize:12,color:'var(--text2)',marginBottom:14}},'Compara a velocidade de vendas entre a 1ª e 2ª metade do período analisado para identificar a fase do produto.'),

    React.createElement(SelModel,{models,value:selId,onChange:onSel}),

    !selId&&React.createElement('div',{className:'card no-data',style:{padding:32}},'Selecione um modelo para ver o ciclo de vida.'),
    selId&&!an&&React.createElement('div',{className:'card no-data',style:{padding:32}},'Sem análise carregada. Vá na aba Análise e faça upload do relatório.'),
    selId&&an&&an.fmt==='upseller'&&React.createElement('div',{style:{fontSize:12,color:'#534AB7',marginBottom:12,padding:'10px 13px',background:'#EEEDFE',border:'1px solid #B5B3DD',borderRadius:9}},
      '📦 Relatório Upseller: dados já agregados sem datas individuais. A divisão P1/P2 é uma estimativa proporcional (50%/50%) — não reflete tendência real de vendas. Para análise de ciclo de vida precisa, use o relatório de vendas do Mercado Livre.'
    ),
    selId&&an&&an.days<14&&an.fmt!=='upseller'&&React.createElement('div',{style:{fontSize:12,color:'var(--amber)',marginBottom:12,padding:'10px 13px',background:'var(--amberbg)',border:'1px solid #FAC775',borderRadius:9}},
      '⚠ O relatório tem menos de 14 dias — a divisão em dois períodos pode não ser representativa. Para análise de ciclo de vida, use relatórios de 30 a 90 dias.'
    ),

    selId&&an&&modelPhase&&React.createElement('div',null,

      // Período info
      React.createElement('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:12}},
        `Período 1: ${fmtDate(an.minDate)} → ${fmtDate(an.midDate)} (${an.p1Days}d)  ·  Período 2: ${fmtDate(an.midDate)} → ${fmtDate(an.maxDate)} (${an.p2Days}d)`
      ),

      // Fase do modelo
      React.createElement('div',{className:'card',style:{marginBottom:12}},
        React.createElement(SecTitle,null,'Fase atual do modelo'),
        React.createElement('div',{style:{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap',marginBottom:16}},
          React.createElement('div',{className:'ciclo-phase',style:{background:modelPhase.bg,color:modelPhase.color,fontSize:15,padding:'8px 18px'}},
            React.createElement('span',{className:'ciclo-arrow'},modelPhase.icon),
            modelPhase.lbl
          ),
          React.createElement('div',{style:{fontSize:22,fontWeight:700,color:an.velVarTotal>=0?'var(--green)':'var(--red)'}},fmtVar(an.velVarTotal)),
          React.createElement('div',{style:{fontSize:12,color:'var(--text2)',lineHeight:1.5,flex:1,minWidth:180}},modelPhase.desc)
        ),
        // Período comparison boxes
        React.createElement('div',{style:{display:'flex',gap:10,flexWrap:'wrap'}},
          React.createElement('div',{className:'ciclo-period-box'},
            React.createElement('div',{className:'ciclo-period-label'},'Período 1 · '+fmtDate(an.minDate)+' – '+fmtDate(an.midDate)),
            React.createElement('div',{className:'ciclo-period-val'},`${an.p1TotalU} un`),
            React.createElement('div',{className:'ciclo-period-sub'},`${an.vel1Total.toFixed(2)} un/dia`)
          ),
          React.createElement('div',{style:{display:'flex',alignItems:'center',fontSize:22,color:'var(--text3)',flexShrink:0}},'→'),
          React.createElement('div',{className:'ciclo-period-box',style:{border:`1.5px solid ${modelPhase.color}40`}},
            React.createElement('div',{className:'ciclo-period-label'},'Período 2 · '+fmtDate(an.midDate)+' – '+fmtDate(an.maxDate)),
            React.createElement('div',{className:'ciclo-period-val',style:{color:modelPhase.color}},`${an.p2TotalU} un`),
            React.createElement('div',{className:'ciclo-period-sub'},`${an.vel2Total.toFixed(2)} un/dia`)
          )
        )
      ),

      // Insights
      React.createElement('div',{className:'card',style:{marginBottom:12}},
        React.createElement(SecTitle,null,'Raciocínio analítico'),
        insights.map((ins,i)=>{const st=INS_ST[ins.tipo]||INS_ST.proj;return React.createElement('div',{key:i,className:'insight',style:{background:st.bg}},
          React.createElement('span',{className:'insight-icon',style:{color:st.col}},st.ic),
          React.createElement('span',{className:'insight-text'},ins.txt)
        );})
      ),

      // Variação por SKU — gráfico
      React.createElement('div',{className:'card',style:{marginBottom:12}},
        React.createElement(SecTitle,null,'Tendência por variação'),
        React.createElement('div',{style:{display:'flex',gap:10,flexWrap:'wrap',marginBottom:12,fontSize:11}},
          [{lbl:'↑ Crescimento ≥20%',col:'#3B6D11',bg:'#EAF3DE'},{lbl:'→ Estável −10% a +20%',col:'#185FA5',bg:'#E6F1FB'},{lbl:'↘ Desacel. −10% a −35%',col:'#854F0B',bg:'#FAEEDA'},{lbl:'↓ Declínio < −35%',col:'#A32D2D',bg:'#FCEBEB'}]
          .map((l,i)=>React.createElement('span',{key:i,style:{background:l.bg,color:l.col,padding:'2px 9px',borderRadius:4,fontWeight:600}},l.lbl))
        ),
        skuRows.map((r,i)=>{
          const ph=r.phase;
          const barPct=Math.abs(r.velVar)/maxAbsVar*100;
          const isPos=r.velVar>=0;
          return React.createElement('div',{key:i,style:{marginBottom:10}},
            React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}},
              React.createElement('div',{style:{fontSize:12,fontWeight:500,color:'var(--text)'}},`${r.cor} · ${r.tamanho}`),
              React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8}},
                React.createElement('span',{style:{fontSize:11,color:'var(--text2)'}},`P1: ${r.vel1.toFixed(2)} → P2: ${r.vel2.toFixed(2)} un/dia`),
                React.createElement('span',{className:'var-chip',style:{background:ph.bg,color:ph.color}},`${r.velVar>=0?'+':''}${r.velVar.toFixed(1)}%`)
              )
            ),
            React.createElement('div',{style:{height:10,background:'var(--bg2)',borderRadius:5,overflow:'hidden'}},
              React.createElement('div',{style:{height:'100%',width:`${barPct}%`,background:ph.color,borderRadius:5,opacity:0.8}})
            )
          );
        })
      ),

      // Tabela detalhada
      React.createElement('div',{className:'card'},
        React.createElement(SecTitle,null,'Tabela detalhada'),
        React.createElement('div',{style:{overflowX:'auto'}},
          React.createElement('table',null,
            React.createElement('thead',null,React.createElement('tr',null,
              ...['Variação','P1 (un)','P2 (un)','Vel. P1','Vel. P2','Variação','Fase'].map(h=>React.createElement('th',{key:h},h))
            )),
            React.createElement('tbody',null,
              skuRows.map((r,i)=>{
                const ph=r.phase;
                return React.createElement('tr',{key:i,style:{background:i%2===1?'var(--bg2)':'transparent'}},
                  React.createElement('td',{style:{fontWeight:500,whiteSpace:'nowrap'}},`${r.cor} · ${r.tamanho}`),
                  React.createElement('td',null,r.p1Qty),
                  React.createElement('td',null,r.p2Qty),
                  React.createElement('td',{style:{color:'var(--text2)'}},`${r.vel1.toFixed(2)}/d`),
                  React.createElement('td',{style:{color:'var(--text2)'}},`${r.vel2.toFixed(2)}/d`),
                  React.createElement('td',{style:{fontWeight:700,color:r.velVar>=0?'var(--green)':'var(--red)'}},fmtVar(r.velVar)),
                  React.createElement('td',null,
                    React.createElement('span',{className:'ciclo-phase',style:{background:ph.bg,color:ph.color,padding:'2px 9px',fontSize:11,borderRadius:20}},
                      `${ph.icon} ${ph.lbl}`
                    )
                  )
                );
              })
            )
          )
        ),
        React.createElement('div',{className:'reasoning-box',style:{marginTop:12}},
          React.createElement('strong',{style:{color:'var(--text)'}},'Como a fase é determinada: '),
          'O relatório é dividido ao meio pela data. A variação % compara a velocidade (un/dia) do P2 vs P1. ',
          React.createElement('strong',{style:{color:'#3B6D11'}},'Crescimento'),': ≥+20%. ',
          React.createElement('strong',{style:{color:'#185FA5'}},'Maturidade'),': entre −10% e +20%. ',
          React.createElement('strong',{style:{color:'#854F0B'}},'Desaceleração'),': entre −10% e −35%. ',
          React.createElement('strong',{style:{color:'#A32D2D'}},'Declínio'),': abaixo de −35%. ',
          'Para melhores resultados, use relatórios de 60 dias.'
        )
      )
    )
  );
}

// ── App ────────────────────────────────────────────────────────────────
function App(){
  const[view,setView]=useState('modelos');
  const[models,setModels]=useState(()=>loadLS(LS_KEY,[]));
  const[stocks,setStocks]=useState(()=>loadLS('gc_stocks',{}));
  const[analyses,setAnalyses]=useState(()=>loadLS('gc_analyses',{}));
  const[costs,setCosts]=useState(()=>loadLS('gc_costs',{}));
  const[pedidos,setPedidos]=useState(()=>loadLS('gc_pedidos',[]));
  const[selId,setSelId]=useState(null);
  const[editing,setEditing]=useState(null);
  const[upStatus,setUpStatus]=useState('');
  const[importStatus,setImportStatus]=useState('');

  useEffect(()=>{if(models.length&&!selId)setSelId(models[0].id);},[models]);

  const saveModels=ms=>{setModels(ms);saveLS(LS_KEY,ms);};
  const saveStock=(id,s)=>{const ns={...stocks,[id]:s};setStocks(ns);saveLS('gc_stocks',ns);};
  const saveAnalysis=(id,a)=>{const na={...analyses,[id]:a};setAnalyses(na);saveLS('gc_analyses',na);};
  const saveCost=(id,v)=>{const nc={...costs,[id]:v};setCosts(nc);saveLS('gc_costs',nc);};
  const savePedido=p=>{const np=[...pedidos,p];setPedidos(np);saveLS('gc_pedidos',np);};
  const deletePedido=id=>{const np=pedidos.filter(p=>p.id!==id);setPedidos(np);saveLS('gc_pedidos',np);};

  const handleImportEstoque=async file=>{
    setImportStatus('Lendo arquivo...');
    try{
      const rows=await readXLS(file);
      let matched=0,varCount=0;
      const newStocks={...stocks};
      for(const m of models){
        const res=importEstoqueFromRows(rows,m);
        if(res){newStocks[m.id]={...(newStocks[m.id]||{}),...res};varCount+=Object.keys(res).length;matched++;}
      }
      if(matched>0){setStocks(newStocks);saveLS('gc_stocks',newStocks);setImportStatus(`✓ Estoque importado: ${varCount} variação(ões) em ${matched} modelo(s).`);}
      else{
        const firstKeys=rows.length?Object.keys(rows[0]):[];
        const temVariantes=firstKeys.some(k=>k==='Variantes'||k==='Variante');
        const semColunaEstoque=!firstKeys.some(k=>/estoque|quantidade|qtde?|saldo|disponível/i.test(k));
        if(semColunaEstoque)setImportStatus('Arquivo sem coluna de estoque. Exporte a "Lista de Estoque" do Upseller (não "Vendas por Variante").');
        else setImportStatus('Nenhum modelo encontrado. Verifique se o nome do produto no cadastro (keyword) aparece no campo "Título" da Lista de Estoque, ou se o SKU cadastrado é prefixo do SKU das variantes.');
      }
    }catch(e){setImportStatus('Erro ao ler o arquivo. Verifique o formato e tente novamente.');}
  };

  const handleSaveModel=m=>{
    const isNew=!m.id;const saved=isNew?{...m,id:uid()}:m;
    saveModels(isNew?[...models,saved]:models.map(x=>x.id===saved.id?saved:x));
    if(isNew)setSelId(saved.id);setEditing(null);
  };
  const handleDelete=id=>{
    saveModels(models.filter(m=>m.id!==id));
    if(selId===id)setSelId(models.find(m=>m.id!==id)?.id||null);
  };
  const handleUpload=async file=>{
    setUpStatus('Lendo arquivo...');
    try{
      const rows=await readXLS(file);
      const fmt=detectFormat(rows);
      const fmtLabel=fmt==='upseller'?'Upseller':fmt==='mercadolivre'?'Mercado Livre':'desconhecido';
      const rowLabel=fmt==='upseller'?'variações':'registros';
      setUpStatus(`${rows.length} ${rowLabel} lidos (formato ${fmtLabel}). Processando...`);
      let matched=0;
      for(const m of models){const res=runAnalysis(rows,m,file.name);if(res){saveAnalysis(m.id,res);matched++;}}
      // Calcular totais redistribuídos de todos os modelos
      let totalRedist=0,totalSkip=0;
      for(const m of models){const res=analyses[m.id];if(res){totalRedist+=(res.redistributedUnits||0);totalSkip+=(res.skippedUnits||0);}}
      const redistMsg=totalRedist>0?` · ${totalRedist} un redistribuídas proporcionalmente`:''
      const skipMsg=totalSkip>0?` · ${totalSkip} un descartadas (variante vazia)`:'';
      const suffix=fmt==='upseller'?` · Período extraído do nome do arquivo${redistMsg}${skipMsg}.`:'';
      setUpStatus(matched>0?`✓ ${matched} modelo(s) analisado(s) via ${fmtLabel}!${suffix}`:`Nenhum modelo encontrado no relatório ${fmtLabel}. Verifique o SKU ou nome nas configurações.`);
    }catch(e){setUpStatus('Erro ao processar o arquivo. Verifique o formato e tente novamente.');}
  };

  const selModel=models.find(m=>m.id===selId);
  const selAn=selId?analyses[selId]:null;
  const selSt=selId?(stocks[selId]||{}):{};
  const rep=selModel&&selAn?buildRep(selAn,selSt,selModel):[];
  const urgCount=rep.filter(r=>r.status==='zerado'||r.status==='urgente').length;

  let loteCount=0;
  for(const m of models){const an=analyses[m.id];const st=stocks[m.id]||{};if(!an)continue;loteCount+=buildRep(an,st,m).filter(r=>r.status==='zerado'||r.status==='urgente').length;}

  const TABS=[
    {id:'modelos',lbl:'Modelos'},
    {id:'analise',lbl:'Análise'},
    {id:'reposicao',lbl:'Reposição',badge:urgCount},
    {id:'lote',lbl:'Lote',badge:loteCount},
    {id:'lucratividade',lbl:'Lucratividade'},
    {id:'ciclo',lbl:'Ciclo de Vida'}
  ];

  return React.createElement('div',{className:'app'},
    React.createElement('div',{className:'nav'},
      React.createElement('div',{className:'nav-title'},'Gestão de Coleção'),
      ...TABS.map(t=>React.createElement('button',{key:t.id,className:`nav-tab${view===t.id?' active':''}`,onClick:()=>setView(t.id)},
        t.lbl,
        t.badge>0&&React.createElement('span',{className:'badge-dot'},t.badge)
      ))
    ),
    React.createElement('div',{className:'content'},
      view==='modelos'&&React.createElement(ModelosView,{models,analyses,onEdit:setEditing,onDelete:handleDelete,onAdd:()=>setEditing({})}),
      view==='analise'&&React.createElement(AnaliseView,{models,selId,onSel:setSelId,analysis:selAn,model:selModel,onUpload:handleUpload,upStatus}),
      view==='reposicao'&&React.createElement(ReposicaoView,{models,selId,onSel:setSelId,model:selModel,analysis:selAn,stock:selSt,rep,onUpdateStock:(k,v)=>saveStock(selId,{...selSt,[k]:+v}),onImportEstoque:handleImportEstoque,importStatus}),
      view==='lote'&&React.createElement(LoteView,{models,analyses,stocks,costs,onUpdateCost:saveCost,pedidos,onSavePedido:savePedido,onDeletePedido:deletePedido}),
      view==='lucratividade'&&React.createElement(LucratividadeView,{models,analyses,costs,selId,onSel:setSelId}),
      view==='ciclo'&&React.createElement(CicloVidaView,{models,analyses,selId,onSel:setSelId})
    ),
    editing!==null&&React.createElement(ModelForm,{model:editing,onSave:handleSaveModel,onClose:()=>setEditing(null)})
  );
}
ReactDOM.render(React.createElement(App),document.getElementById('root'));
</script>
</body>
